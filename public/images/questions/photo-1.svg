<svg xmlns="http://www.w3.org/2000/svg"
     width="800"
     height="450"
     viewBox="0 0 800 450"
     role="img"
     aria-labelledby="title desc">
    <title id="title">DET Practice photo placeholder</title>
    <desc id="desc">A simple placeholder image for the Write About the Photo question.</desc>

    <rect width="800" height="450" fill="#eff6ff"/>

    <rect x="40" y="40"
